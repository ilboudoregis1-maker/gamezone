<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game-Zone by CNS.corp</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="fabric"></div>
<header class="top">
  <div class="brand">
    <span id="logo"></span>
    <div><h1>GAME-ZONE</h1><small>by CNS.corp</small></div>
  </div>
  <div class="stat" id="totalTime"></div>
</header>
<main id="hub"></main>
<div id="gameLayer" class="hidden"></div>
<div id="aiLayer"></div>
<script>(function(){
var P=function(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition};
var want=false,busy=false;
function ok(){var S=P();if(!S)return Promise.resolve(false);return S.requestPermissions().then(function(r){return r&&r.speechRecognition==="granted"}).catch(function(){return false})}
function loop(){if(!want||busy)return;var S=P();if(!S)return;busy=true;
S.start({language:"fr-FR",maxResults:3,partialResults:true,popup:false}).then(function(r){busy=false;var m=(r&&r.matches)||[];if(m[0]&&window.onHeard)window.onHeard(m[0]);if(want)setTimeout(loop,250)}).catch(function(){busy=false;if(want)setTimeout(loop,800)})}
window.Android={
start:function(){want=true;ok().then(function(g){if(g)loop();else want=false})},
stop:function(){want=false;var S=P();if(S)S.stop().catch(function(){})},
speak:function(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";speechSynthesis.speak(u)}
};
function attach(){var S=P();if(!S)return setTimeout(attach,500);S.addListener("partialResults",function(d){var m=(d&&d.matches)||[];if(m[0]&&window.onPartial)window.onPartial(m[0])})}
attach();
})();</script>
<script src="js/icons.js"></script><script src="js/covers.js"></script>
<script src="js/store.js"></script>
<script src="js/hub.js"></script>
<script src="games/g0.js"></script><script src="games/tam.js"></script><script src="games/gri.js"></script><script src="games/lab.js"></script><script src="games/bao.js"></script><script src="games/cau.js"></script><script src="games/duel.js"></script><script src="games/ter.js"></script><script src="js/ai.js"></script><script src="js/voice.js"></script><script src="js/bf.js"></script><script src="js/bf2.js"></script><script src="js/talk.js"></script><script src="js/mic.js"></script><script src="js/three.min.js"></script><script src="games/faso.js"></script><script src="js/kb.js"></script><script src="js/auth.js"></script></body>
</html>
